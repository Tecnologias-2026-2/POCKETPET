<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta - PocketPet</title>
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <div class="auth-layout">

    <div class="auth-left">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>

      <div class="brand">
        <img src="assets/mascota.png" alt="PocketPet" class="brand-icon">
        <span>POCKETPET</span>
      </div>

      <img src="assets/mascota_saludando.png" alt="Mascota PocketPet" class="mascot">

      <div class="left-text">
        <h2>¡Únete y transforma<br>tus finanzas!</h2>
        <p>Comienza tu camino hacia la libertad financiera</p>
      </div>
    </div>

    <div class="auth-right">
      <h1>Crea tu cuenta</h1>
      <p class="subtitle">Es gratis y tarda menos de un minuto</p>

      <form id="register-form" action="inicio.html">
        <label for="name">Nombre completo</label>
        <input type="text" id="name" placeholder="Tu nombre" required>

        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="tucorreo@ejemplo.com" required>

        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Mínimo 6 caracteres" required>

        <label for="confirm-password">Confirmar contraseña</label>
        <input type="password" id="confirm-password" placeholder="Repite tu contraseña" required>

        <button type="submit" class="btn-primary">Registrarse</button>
      </form>

      <p class="switch-link">¿Ya tienes cuenta? <a href="login.html">INICIA SESIÓN</a></p>
    </div>

  </div>

</body>
</html>
