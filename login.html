<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - PocketPet</title>
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <div class="auth-layout">

    <div class="auth-left">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>

      <div class="brand">
        <img src="assets/mascota.png" alt="PocketPet" class="brand-icon">
        <span>POCKETPET</span>
      </div>

      <img src="assets/mascota_saludando.png" alt="Mascota PocketPet" class="mascot">

      <div class="left-text">
        <h2>Ahorra hoy,<br>construye tu mañana</h2>
        <p>Tu aliado financiero siempre presente</p>
      </div>
    </div>

    <div class="auth-right">
      <h1>Iniciar Sesión</h1>
      <p class="subtitle">Vuelve a tus Finanzas</p>

      <form id="login-form">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="tucorreo@ejemplo.com" required>

        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required>

        <button type="submit" class="btn-primary">Iniciar Sesión</button>
      </form>

      <p class="switch-link">¿No tienes cuenta? <a href="registro.html">REGÍSTRATE</a></p>
    </div>

  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim().toLowerCase();

      // Guarda quién inició sesión
      localStorage.setItem('usuarioActual', email);

      window.location.href = 'inicio.html';
    });
  </script>

</body>
</html>
